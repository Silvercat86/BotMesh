services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set; use --env-file .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set; use --env-file .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set; use --env-file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend/bot_platform
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:1.29
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_volume:/static:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
