name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: botmesh_test
          POSTGRES_USER: botmesh
          POSTGRES_PASSWORD: botmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botmesh -d botmesh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/bot_platform
    env:
      SECRET_KEY: ci-only-secret
      DB_NAME: botmesh_test
      DB_USER: botmesh
      DB_PASSWORD: botmesh
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot_platform/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner/bot_runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/bot_runner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
