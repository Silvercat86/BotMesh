<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}BotMesh{% endblock %}</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e3e8f0;--brand:#6558e8;--green:#168763;--red:#c74646}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.nav{height:68px;background:#171b2e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1180px)/2));}.brand{font-size:21px;font-weight:750}.navlinks{display:flex;gap:22px;align-items:center}.navlinks a{color:#cbd1e2}.container{max-width:1180px;margin:34px auto;padding:0 22px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.heading h1{margin:0 0 7px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:21px;box-shadow:0 3px 14px #1d2a4a0a}.card h2,.card h3{margin-top:0}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:650;cursor:pointer}.button.secondary{background:#edf0f6;color:var(--ink)}.button.danger{background:#fff0f0;color:var(--red)}.button.success{background:#e8f7f1;color:var(--green)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:#eef0f5;color:#556}.badge.on{background:#e5f6ef;color:var(--green)}.badge.off{background:#f1f2f5;color:#747b89}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.stat strong{display:block;font-size:28px;margin-top:8px}form.inline{display:inline}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ccd3df;border-radius:9px;background:#fff;font:inherit}input[type=checkbox]{width:auto}label{font-weight:650}form p{margin:0 0 18px}.errorlist{color:var(--red)}@media(max-width:650px){.nav{padding:0 18px}.navlinks a:not(:last-child){display:none}.stats{grid-template-columns:1fr}.heading{display:block}.heading .button{margin-top:14px}}
</style></head><body><nav class="nav"><a class="brand" href="{% url 'dashboard_home' %}">BotMesh</a>{% if request.user.is_authenticated %}<div class="navlinks"><a href="{% url 'dashboard_bot_list' %}">Боты</a>{% if request.user.is_superuser %}<a href="{% url 'dashboard_bot_create' %}">Создать бота</a>{% endif %}<span>{{ request.user.username }}</span><form class="inline" method="post" action="{% url 'dashboard_logout' %}">{% csrf_token %}<button class="button secondary">Выйти</button></form></div>{% endif %}</nav><main class="container">{% block content %}{% endblock %}</main></body></html>
