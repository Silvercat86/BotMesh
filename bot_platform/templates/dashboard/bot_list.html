{% extends "dashboard/base.html" %}

{% block content %}
<h1>Боты</h1>

{% for bot in bots %}
    <div class="card">
        <h2>{{ bot.name }}</h2>

        <p class="muted">
            Платформа: {{ bot.platform }} |
            Активен: {{ bot.is_active }} |
            Версия: {{ bot.version }}
        </p>

        <div class="row">
            <a class="button" href="{% url 'dashboard_bot_plugins' bot.id %}">
                Плагины
            </a>

            <a class="button secondary" href="{% url 'dashboard_raw_bot_config' bot.id %}">
                Raw JSON
            </a>
        </div>
    </div>
{% empty %}
    <div class="card">
        Ботов пока нет.
    </div>
{% endfor %}
{% endblock %}
