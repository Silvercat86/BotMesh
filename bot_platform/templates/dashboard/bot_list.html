<h1>Боты</h1>

{% for bot in bots %}
    <div style="border: 1px solid #ccc; padding: 16px; margin-bottom: 12px;">
        <h2>{{ bot.name }}</h2>

        <p>Платформа: {{ bot.platform }}</p>
        <p>Активен: {{ bot.is_active }}</p>
        <p>Версия: {{ bot.version }}</p>

        <a href="{% url 'dashboard_bot_plugins' bot.id %}">
            Плагины
        </a>
    </div>
{% empty %}
    <p>Ботов нет.</p>
{% endfor %}
