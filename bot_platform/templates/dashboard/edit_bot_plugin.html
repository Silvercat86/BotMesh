<h1>Редактирование плагина</h1>

<p>Бот: {{ bot.name }}</p>
<p>Плагин: {{ plugin_definition.code }}</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>

<hr>

<h2>Текущий JSON</h2>

<pre>{{ plugin_item }}</pre>

<p>
    <a href="{% url 'dashboard_bot_plugins' bot.id %}">
        Назад
    </a>
</p>
